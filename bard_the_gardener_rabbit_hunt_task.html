<!DOCTYPE html>
<html>
<head>
  <title>Bard the Gardener: Rabbit Hunt</title>
  <script src="https://unpkg.com/jspsych@8.2.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    body {
      background: linear-gradient(#8fd3ff, #bfe9c9);
    }
    .jspsych-display-element { color: #1a2e1a; }
    h1.title {
      text-align: center;
      font-size: 26px;
      margin-bottom: 0;
      color: #2d4a2d;
    }
    #scoreboard {
      text-align: center;
      font-size: 17px;
      margin-top: 8px;
      color: #2d4a2d;
      font-weight: 600;
    }
    #bomb-tray {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 6px;
      font-size: 20px;
    }
    .bomb-slot { opacity: 1; transition: opacity 0.2s; }
    .bomb-slot.used { opacity: 0.15; }
    #field-box {
      position: relative;
      width: 520px;
      height: 520px;
      margin: 16px auto;
      cursor: crosshair;
    }
    .bomb-icon {
      position: absolute;
      font-size: 26px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: bomb-drop 0.25s ease-out;
    }
    @keyframes bomb-drop {
      0% { transform: translate(-50%, -80%) scale(0.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .explosion-icon {
      position: absolute;
      font-size: 40px;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      opacity: 1;
      animation: boom 0.5s ease-out forwards;
    }
    @keyframes boom {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      60% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
    }
    .callout-text {
      position: absolute;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      transition: opacity 0.7s, transform 0.7s;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    #bomb-refill-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 20, 10, 0.85);
      color: #ffd27a;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: center;
      z-index: 20;
    }
    #bomb-refill-banner.show { opacity: 1; }
    #end-hint {
      position: fixed;
      bottom: 10px;
      right: 14px;
      color: #2d4a2d;
      font-size: 12px;
      z-index: 1000;
    }
    .hist-bar-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 160px;
      margin: 20px auto 0 auto;
    }
    .hist-bar {
      width: 28px;
      background: #4caf50;
      border-radius: 3px 3px 0 0;
    }
    .hist-label {
      font-size: 10px;
      color: #2d4a2d;
      text-align: center;
      width: 28px;
    }
    .recap-legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: #2d4a2d;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .story-box {
      max-width: 620px;
      margin: 0 auto;
      text-align: left;
      background: rgba(255,255,255,0.6);
      padding: 18px 24px;
      border-radius: 12px;
    }
  </style>
</head>
<body></body>
<script>

// ---------- geometry ----------
const CENTER = 260;
const FIELD_RADIUS = 230;

const RABBIT_BURROW_ARC_DEG = 12;     // "width" of the rabbit's hiding zone
const BOMB_BLAST_TOLERANCE_DEG = 8;   // a little extra forgiveness on blast radius
const HIT_TOLERANCE_DEG = RABBIT_BURROW_ARC_DEG / 2 + BOMB_BLAST_TOLERANCE_DEG;

const BOMBS_PER_BATCH = 10;

function xyToAngle(x, y) {
  const dx = x - CENTER;
  const dy = y - CENTER;
  let deg = (Math.atan2(dx, -dy) * 180) / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function angleToXY(angleDeg, radius) {
  const rad = (angleDeg * Math.PI) / 180;
  return {
    x: CENTER + radius * Math.sin(rad),
    y: CENTER - radius * Math.cos(rad),
  };
}

function circularDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function wrapAngle(a) {
  return ((a % 360) + 360) % 360;
}

// ---------- random number / PDF helpers ----------
function gaussianRandom(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return mean + z * std;
}

function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}

function stdNormalPDF(z) {
  return Math.exp((-z * z) / 2) / Math.sqrt(2 * Math.PI);
}

function stdNormalCDF(z) {
  return 0.5 * (1 + erf(z / Math.sqrt(2)));
}

function skewNormalRandom(mean, std, alpha) {
  const delta = alpha / Math.sqrt(1 + alpha * alpha);
  const u0 = gaussianRandom(0, 1);
  const v = gaussianRandom(0, 1);
  const u1 = delta * u0 + Math.sqrt(1 - delta * delta) * v;
  const z = u0 >= 0 ? u1 : -u1;
  return mean + std * z;
}

function gaussianPDFraw(x, mean, std) {
  return stdNormalPDF((x - mean) / std) / std;
}

function skewNormalPDFraw(x, mean, std, alpha) {
  const z = (x - mean) / std;
  return (2 / std) * stdNormalPDF(z) * stdNormalCDF(alpha * z);
}

function uniformPDFraw(x, low, high) {
  return x >= low && x <= high ? 1 / (high - low) : 0;
}

function weightedChoice(weights) {
  const r = Math.random();
  let cum = 0;
  for (let i = 0; i < weights.length; i++) {
    cum += weights[i];
    if (r <= cum) return i;
  }
  return weights.length - 1;
}

function sampleModes(numModes, minSepDeg) {
  const modes = [];
  let guard = 0;
  while (modes.length < numModes && guard < 500) {
    guard++;
    const candidate = Math.random() * 360;
    if (modes.every((m) => circularDist(m, candidate) >= minSepDeg)) {
      modes.push(candidate);
    }
  }
  while (modes.length < numModes) {
    modes.push((360 / numModes) * modes.length);
  }
  return modes;
}

// ---------- rabbit's favorite hiding-spot distribution ----------
// Chosen once per task run and hidden until the end: the rabbit doesn't
// hide uniformly around the whole garden, it has favorite spots.
const DIST_MAKERS = {
  gaussian: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    return { type: 'gaussian', mean, std };
  },
  uniform: () => {
    const center = Math.random() * 360;
    const halfWidth = 30 + Math.random() * 60;
    return { type: 'uniform', low: center - halfWidth, high: center + halfWidth, center, halfWidth };
  },
  bimodal: () => {
    const centers = sampleModes(2, 90);
    const w1 = 0.35 + Math.random() * 0.3;
    const weights = [w1, 1 - w1];
    const modes = centers.map((mean, i) => ({
      mean,
      std: 10 + Math.random() * 12,
      weight: weights[i],
    }));
    return { type: 'bimodal', modes };
  },
  multimodal: () => {
    const k = 3 + (Math.random() < 0.5 ? 0 : 1);
    const centers = sampleModes(k, 55);
    const rawWeights = centers.map(() => 0.5 + Math.random());
    const sumW = rawWeights.reduce((a, b) => a + b, 0);
    const modes = centers.map((mean, i) => ({
      mean,
      std: 8 + Math.random() * 10,
      weight: rawWeights[i] / sumW,
    }));
    return { type: 'multimodal', modes };
  },
  skewed: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    const magnitude = 3 + Math.random() * 4;
    const alpha = Math.random() < 0.5 ? -magnitude : magnitude;
    return { type: 'skewed', mean, std, alpha };
  },
  // uniform over a range, but with an elevated "hotspot" bump somewhere
  // inside that range -- mostly flat, with one peak
  peaked: () => {
    const rangeCenter = Math.random() * 360;
    const rangeHalfWidth = 40 + Math.random() * 40; // range width 80-160 deg
    const low = rangeCenter - rangeHalfWidth;
    const high = rangeCenter + rangeHalfWidth;
    const peakOffset = (Math.random() * 2 - 1) * rangeHalfWidth * 0.6;
    const peakLocation = wrapAngle(rangeCenter + peakOffset);
    const peakStd = 8 + Math.random() * 10;
    const peakWeight = 0.4 + Math.random() * 0.3;
    return { type: 'peaked', low, high, peakLocation, peakStd, peakWeight };
  },
};

const DIST_LABELS = {
  gaussian: 'Gaussian',
  uniform: 'Uniform',
  bimodal: 'Bimodal',
  multimodal: 'Multimodal',
  skewed: 'Skewed',
  peaked: 'Peaked (uniform + hotspot)',
};

const DIST_CHOICE_ORDER = ['gaussian', 'uniform', 'bimodal', 'multimodal', 'skewed', 'peaked'];

// which distribution families are allowed to be sampled, chosen by the
// player on the setup screen before the hunt begins
let allowedDistTypes = Object.keys(DIST_MAKERS);

function makeSessionDist() {
  const keys = allowedDistTypes && allowedDistTypes.length > 0 ? allowedDistTypes : Object.keys(DIST_MAKERS);
  const key = keys[Math.floor(Math.random() * keys.length)];
  return DIST_MAKERS[key]();
}

function drawFromDist(distParams) {
  switch (distParams.type) {
    case 'gaussian':
      return wrapAngle(gaussianRandom(distParams.mean, distParams.std));
    case 'uniform':
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    case 'bimodal':
    case 'multimodal': {
      const idx = weightedChoice(distParams.modes.map((m) => m.weight));
      const m = distParams.modes[idx];
      return wrapAngle(gaussianRandom(m.mean, m.std));
    }
    case 'skewed':
      return wrapAngle(skewNormalRandom(distParams.mean, distParams.std, distParams.alpha));
    case 'peaked': {
      if (Math.random() < distParams.peakWeight) {
        return wrapAngle(gaussianRandom(distParams.peakLocation, distParams.peakStd));
      }
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    }
    default:
      return Math.random() * 360;
  }
}

function marginalPDF(distParams, xWrapped) {
  let total = 0;
  for (let k = -1; k <= 1; k++) {
    const x = xWrapped + 360 * k;
    if (distParams.type === 'gaussian') {
      total += gaussianPDFraw(x, distParams.mean, distParams.std);
    } else if (distParams.type === 'uniform') {
      total += uniformPDFraw(x, distParams.low, distParams.high);
    } else if (distParams.type === 'bimodal' || distParams.type === 'multimodal') {
      distParams.modes.forEach((m) => {
        total += m.weight * gaussianPDFraw(x, m.mean, m.std);
      });
    } else if (distParams.type === 'skewed') {
      total += skewNormalPDFraw(x, distParams.mean, distParams.std, distParams.alpha);
    } else if (distParams.type === 'peaked') {
      total += distParams.peakWeight * gaussianPDFraw(x, distParams.peakLocation, distParams.peakStd);
      total += (1 - distParams.peakWeight) * uniformPDFraw(x, distParams.low, distParams.high);
    }
  }
  return total;
}

function buildDistributionChart(distParams, angles, barColor, chartWidth = 720, chartHeight = 160) {
  const nBins = 24;
  const binWidth = 360 / nBins;
  const counts = new Array(nBins).fill(0);
  angles.forEach((a) => {
    let idx = Math.floor(a / binWidth);
    if (idx >= nBins) idx = nBins - 1;
    counts[idx]++;
  });
  const n = angles.length;
  const density = counts.map((c) => c / (n * binWidth));

  const curvePts = [];
  for (let x = 0; x < 360; x += 2) {
    curvePts.push({ x, d: marginalPDF(distParams, x) });
  }

  const maxScale = Math.max(...density, ...curvePts.map((p) => p.d), 1e-6) * 1.15;
  const CH_W = chartWidth, CH_H = chartHeight;
  const barW = CH_W / nBins;

  const bars = density
    .map((d, i) => {
      const h = (d / maxScale) * CH_H;
      const x = i * barW;
      return `<rect x="${x}" y="${CH_H - h}" width="${barW - 1}" height="${h}" fill="${barColor}" opacity="0.6" />`;
    })
    .join('');

  const linePts = curvePts
    .map((p) => {
      const x = (p.x / 360) * CH_W;
      const y = CH_H - (p.d / maxScale) * CH_H;
      return `${x},${y}`;
    })
    .join(' ');

  return `
    <svg width="${CH_W}" height="${CH_H}" style="background:#eaf5e6; border:1px solid #8fbf8f; border-radius:6px;">
      ${bars}
      <polyline points="${linePts}" fill="none" stroke="#2d4a2d" stroke-width="2" />
    </svg>
    <div style="display:flex; justify-content:space-between; width:${CH_W}px; margin:2px auto 0 auto; font-size:11px; color:#2d4a2d;">
      <span>0&deg;</span><span>90&deg;</span><span>180&deg;</span><span>270&deg;</span><span>360&deg;</span>
    </div>
  `;
}

function movingAverage(arr, windowSize) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = arr.slice(start, i + 1);
    return slice.reduce((a, b) => a + b, 0) / slice.length;
  });
}

function buildTrendChart(valuesArr, dotColor) {
  const n = valuesArr.length;
  const CH_W = 720, CH_H = 200;
  const padL = 34, padB = 22, padT = 10, padR = 10;
  const plotW = CH_W - padL - padR;
  const plotH = CH_H - padT - padB;
  const maxY = Math.max(...valuesArr, 1) * 1.15;
  const windowSize = Math.min(5, n);

  const xFor = (i) => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yFor = (v) => padT + plotH - (v / maxY) * plotH;

  const rawPts = valuesArr.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' ');
  const ma = movingAverage(valuesArr, windowSize);
  const maPts = ma.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' ');
  const dots = valuesArr
    .map((v, i) => `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${dotColor}" opacity="0.7" />`)
    .join('');

  const yTicks = [0, maxY / 2, maxY];
  const yAxis = yTicks
    .map(
      (v) => `
      <text x="${padL - 6}" y="${yFor(v) + 4}" font-size="10" fill="#2d4a2d" text-anchor="end">${Math.round(v)}</text>
      <line x1="${padL}" y1="${yFor(v)}" x2="${CH_W - padR}" y2="${yFor(v)}" stroke="#ccc" stroke-width="0.5" />
    `
    )
    .join('');

  const xTickEvery = Math.max(1, Math.ceil(n / 10));
  const xAxis = valuesArr
    .map((_, i) =>
      i % xTickEvery === 0
        ? `<text x="${xFor(i)}" y="${CH_H - padB + 14}" font-size="10" fill="#2d4a2d" text-anchor="middle">${i + 1}</text>`
        : ''
    )
    .join('');

  return {
    windowSize,
    svg: `
    <svg width="${CH_W}" height="${CH_H}" style="background:#eaf5e6; border:1px solid #8fbf8f; border-radius:6px;">
      ${yAxis}
      <polyline points="${rawPts}" fill="none" stroke="${dotColor}" stroke-width="1.5" opacity="0.5" />
      ${dots}
      <polyline points="${maPts}" fill="none" stroke="#2d4a2d" stroke-width="2.5" />
      ${xAxis}
    </svg>`,
  };
}

function buildLearningCurveChart(attemptsArr) {
  const { svg, windowSize } = buildTrendChart(attemptsArr, '#e07b39');
  return `
    ${svg}
    <div style="font-size:11px; color:#2d4a2d; margin-top:2px;">
      trial number (x-axis) &nbsp;|&nbsp; orange dots = bombs needed that trial &nbsp;|&nbsp;
      dark green = moving average (window ${windowSize})
    </div>
  `;
}

function buildFirstGuessAccuracyChart(errorsArr) {
  const { svg, windowSize } = buildTrendChart(errorsArr, '#c0392b');
  return `
    ${svg}
    <div style="font-size:11px; color:#2d4a2d; margin-top:2px;">
      trial number (x-axis) &nbsp;|&nbsp; red dots = first-throw error to nearest true peak (&deg;) &nbsp;|&nbsp;
      dark green = moving average (window ${windowSize})
    </div>
  `;
}

// peak(s) of the true generating distribution -- for a multi-peak
// distribution (bimodal/multimodal) this returns each mode's mean; for
// uniform there's no real peak so we use its center as a stand-in.
function getDistPeaks(distParams) {
  if (!distParams) return [];
  switch (distParams.type) {
    case 'gaussian':
      return [distParams.mean];
    case 'uniform':
      return [wrapAngle((distParams.low + distParams.high) / 2)];
    case 'bimodal':
    case 'multimodal':
      return distParams.modes.map((m) => m.mean);
    case 'peaked':
      return [distParams.peakLocation];
    case 'skewed': {
      let bestX = distParams.mean;
      let bestD = -Infinity;
      for (let x = 0; x < 360; x += 0.5) {
        const d = marginalPDF(distParams, x);
        if (d > bestD) {
          bestD = d;
          bestX = x;
        }
      }
      return [bestX];
    }
    default:
      return [];
  }
}

function distanceToNearestPeak(angle, peaks) {
  if (peaks.length === 0) return null;
  return Math.min(...peaks.map((p) => circularDist(angle, p)));
}

// ---------- garden field background art ----------
// The rabbit can only hide along a single 1D ring path that loops around
// the garden (its hiding spot is an angle, not a 2D position). Bombs are
// always thrown onto that path -- clicking anywhere just picks the angle.
const PATH_RADIUS = FIELD_RADIUS - 40;
const PATH_WIDTH = 26;

function buildFieldSVG() {
  // grass tufts scattered near the path, generated once so they don't
  // flicker between clicks. Purely decorative -- carries no information
  // about where the rabbit is hiding.
  let tufts = '';
  const nTufts = 160;
  for (let i = 0; i < nTufts; i++) {
    const r = PATH_RADIUS + (Math.random() - 0.5) * (PATH_WIDTH + 26);
    const theta = Math.random() * Math.PI * 2;
    const x = CENTER + r * Math.cos(theta);
    const y = CENTER + r * Math.sin(theta);
    const h = 6 + Math.random() * 8;
    const lean = (Math.random() - 0.5) * 6;
    const shade = 30 + Math.floor(Math.random() * 30);
    tufts += `<path d="M${x},${y} q${lean},-${h / 2} ${lean * 1.5},-${h}"
                stroke="hsl(100, 45%, ${shade}%)" stroke-width="2" fill="none" stroke-linecap="round" />`;
  }

  return `
    <svg width="520" height="520" style="position:absolute; top:0; left:0;">
      <defs>
        <radialGradient id="grassGrad" cx="50%" cy="45%" r="65%">
          <stop offset="0%" stop-color="#bfe6bf" />
          <stop offset="100%" stop-color="#8fd18f" />
        </radialGradient>
      </defs>
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="url(#grassGrad)" stroke="#2d4a2d" stroke-width="4" />
      ${tufts}
      <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none"
              stroke="#c2a26a" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.9" />
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="none" stroke="#2d4a2d" stroke-width="4" />
    </svg>
  `;
}

// ---------- CSV data export ----------
function csvEscape(val) {
  const s = String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCSV() {
  const distType = lastSessionDist ? lastSessionDist.type : '';
  const distSummary = lastSessionDist ? JSON.stringify(lastSessionDist) : '';
  const distPeaks = lastSessionDist ? getDistPeaks(lastSessionDist) : [];
  const nTrials = completedTrials.length;
  const thirdSize = Math.max(1, Math.ceil(nTrials / 3));
  const segmentFor = (trialIdx) => {
    if (trialIdx < thirdSize) return 'early';
    if (trialIdx < thirdSize * 2) return 'middle';
    return 'late';
  };

  const header = [
    'trial', 'attempt', 'guess_angle_deg', 'hit', 'target_angle_deg',
    'trial_total_attempts', 'trial_rt_ms', 'trial_segment',
    'first_guess_error_to_peak_deg',
    'session_distribution_type', 'session_distribution_params',
  ];
  const rows = [header.join(',')];
  completedTrials.forEach((t, trialIdx) => {
    const firstGuessError = distPeaks.length > 0 && t.guesses.length > 0
      ? distanceToNearestPeak(t.guesses[0].angle, distPeaks).toFixed(2)
      : '';
    t.guesses.forEach((g, i) => {
      const row = [
        t.trial,
        i + 1,
        g.angle.toFixed(2),
        g.hit,
        t.targetAngle.toFixed(2),
        t.attempts,
        t.rt.toFixed(1),
        segmentFor(trialIdx),
        i === 0 ? firstGuessError : '',
        distType,
        csvEscape(distSummary),
      ];
      rows.push(row.join(','));
    });
  });
  return rows.join('\n');
}

function downloadCSV() {
  if (completedTrials.length === 0) return;
  const csv = buildCSV();
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const a = document.createElement('a');
  a.href = url;
  a.download = `bard_gardener_rabbit_hunt_data_${ts}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- global state ----------
let jsPsychInstance;
let lastSessionDist = null;
const completedTrials = []; // { trial, targetAngle, guesses: [{angle, hit}], attempts, rt }

function startTask() {
  const display = jsPsychInstance.getDisplayElement();

  display.innerHTML = `
    <h1 class="title">🌿 Bard the Gardener vs. The Hidden Rabbit 🐰</h1>
    <div id="scoreboard"></div>
    <div id="bomb-tray"></div>
    <div id="field-box">
      ${buildFieldSVG()}
      <div id="bomb-refill-banner"></div>
    </div>
  `;

  const fieldBox = display.querySelector('#field-box');
  const scoreboard = display.querySelector('#scoreboard');
  const bombTray = display.querySelector('#bomb-tray');
  const refillBanner = display.querySelector('#bomb-refill-banner');

  const sessionDist = makeSessionDist();
  lastSessionDist = sessionDist;

  let rabbitAngle = drawFromDist(sessionDist);
  let currentGuesses = []; // bombs thrown so far this trial
  let trialStartTime = performance.now();
  let bombsLeftInBatch = BOMBS_PER_BATCH;
  let busy = false; // block clicks during explosion animation

  function updateScoreboard() {
    const n = completedTrials.length;
    const meanBombs =
      n > 0 ? (completedTrials.reduce((a, t) => a + t.attempts, 0) / n).toFixed(1) : '—';
    scoreboard.textContent =
      `Trial ${n + 1} | Bombs thrown this trial: ${currentGuesses.length} | Rabbits caught: ${n} | Mean bombs per catch: ${meanBombs}`;
  }

  function renderBombTray() {
    let html = '';
    for (let i = 0; i < BOMBS_PER_BATCH; i++) {
      const used = i >= bombsLeftInBatch;
      html += `<span class="bomb-slot${used ? ' used' : ''}">💣</span>`;
    }
    bombTray.innerHTML = html;
  }

  function showRefillBanner() {
    refillBanner.textContent = "Bard's out of bombs — grabs 10 more from the wheelbarrow! 🧰";
    refillBanner.classList.add('show');
    setTimeout(() => refillBanner.classList.remove('show'), 1400);
  }

  function placeBombAndExplode(p, gotHit, callback) {
    busy = true;
    const bomb = document.createElement('div');
    bomb.className = 'bomb-icon';
    bomb.textContent = '💣';
    bomb.style.left = `${p.x}px`;
    bomb.style.top = `${p.y}px`;
    fieldBox.appendChild(bomb);

    setTimeout(() => {
      bomb.remove();
      const boom = document.createElement('div');
      boom.className = 'explosion-icon';
      boom.textContent = gotHit ? '💥🐰' : '💥';
      boom.style.left = `${p.x}px`;
      boom.style.top = `${p.y}px`;
      fieldBox.appendChild(boom);

      setTimeout(() => {
        boom.remove();
        busy = false;
        if (callback) callback();
      }, 500);
    }, 280);
  }

  function showCallout(p, text, color, riseAmount) {
    const el = document.createElement('div');
    el.className = 'callout-text';
    el.textContent = text;
    el.style.color = color;
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y - 30}px`;
    fieldBox.appendChild(el);
    requestAnimationFrame(() => {
      el.style.opacity = '0';
      el.style.transform = `translate(-50%, -${60 + (riseAmount || 0)}%)`;
    });
    setTimeout(() => el.remove(), 750);
  }

  function onFieldClick(evt) {
    if (busy) return;
    const rect = fieldBox.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    const dx = x - CENTER, dy = y - CENTER;
    if (Math.sqrt(dx * dx + dy * dy) > FIELD_RADIUS) return; // must click inside the garden

    // the hiding space is 1D: only the click's angle matters. The bomb
    // always lands on the path ring at that angle, regardless of exactly
    // how far from the center you clicked.
    const bombAngle = xyToAngle(x, y);
    const p = angleToXY(bombAngle, PATH_RADIUS);
    const gotHit = circularDist(bombAngle, rabbitAngle) <= HIT_TOLERANCE_DEG;

    currentGuesses.push({ angle: bombAngle, hit: gotHit });
    bombsLeftInBatch--;
    renderBombTray();

    placeBombAndExplode(p, gotHit, () => {
      if (gotHit) {
        const rt = performance.now() - trialStartTime;
        completedTrials.push({
          trial: completedTrials.length + 1,
          targetAngle: rabbitAngle,
          guesses: currentGuesses,
          attempts: currentGuesses.length,
          rt: rt,
        });
        showCallout(p, `Caught in ${currentGuesses.length}! 🐰`, '#ffd700', 10);

        rabbitAngle = drawFromDist(sessionDist);
        currentGuesses = [];
        trialStartTime = performance.now();
        bombsLeftInBatch = BOMBS_PER_BATCH;
        renderBombTray();
      } else {
        showCallout(p, 'Missed!', '#ffffff', 0);
        if (bombsLeftInBatch <= 0) {
          bombsLeftInBatch = BOMBS_PER_BATCH;
          renderBombTray();
          showRefillBanner();
        }
      }
      updateScoreboard();
    });
  }

  function cleanupListeners() {
    fieldBox.removeEventListener('click', onFieldClick);
    document.removeEventListener('keydown', onKeydown);
  }

  const onKeydown = (evt) => {
    if (evt.key === 'Escape') {
      cleanupListeners();
      showAnalysisScreen();
    }
  };

  fieldBox.addEventListener('click', onFieldClick);
  document.addEventListener('keydown', onKeydown);

  renderBombTray();
  updateScoreboard();
}

// ---------- analysis screen (ESC ends the task) ----------
function showAnalysisScreen() {
  const display = jsPsychInstance.getDisplayElement();

  if (completedTrials.length === 0) {
    display.innerHTML = `
      <div class="story-box" style="margin-top:60px;">
        <p style="font-size:22px;">🐰 The rabbit got away! Task ended.</p>
        <p>No rabbits were caught before ending.</p>
      </div>
    `;
    return;
  }

  const n = completedTrials.length;
  const attemptsArr = completedTrials.map((t) => t.attempts);
  const meanAttempts = attemptsArr.reduce((a, b) => a + b, 0) / n;
  const sorted = [...attemptsArr].sort((a, b) => a - b);
  const median = sorted.length % 2 === 0
    ? (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2
    : sorted[(sorted.length - 1) / 2];
  const minAttempts = Math.min(...attemptsArr);
  const maxAttempts = Math.max(...attemptsArr);

  const bins = [1, 2, 3, 4, 5];
  const counts = bins.map((b) => attemptsArr.filter((a) => a === b).length);
  const overflow = attemptsArr.filter((a) => a > 5).length;
  const allCounts = [...counts, overflow];
  const allLabels = [...bins.map(String), '6+'];
  const maxCount = Math.max(...allCounts, 1);

  let bars_html = '';
  let labels_html = '';
  allCounts.forEach((c, i) => {
    const height = Math.round((c / maxCount) * 140);
    bars_html += `<div style="display:flex; flex-direction:column; align-items:center;">
        <div style="font-size:11px; color:#2d4a2d; margin-bottom:2px;">${c}</div>
        <div class="hist-bar" style="height:${height}px;"></div>
      </div>`;
    labels_html += `<div class="hist-label">${allLabels[i]}</div>`;
  });

  const guess_dots = completedTrials
    .flatMap((t) => t.guesses)
    .map((g) => {
      const p = angleToXY(g.angle, PATH_RADIUS);
      return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${g.hit ? '#2ecc40' : '#e74c3c'}" opacity="0.85" />`;
    })
    .join('');

  const target_dots = completedTrials
    .map((t) => {
      const p = angleToXY(t.targetAngle, PATH_RADIUS);
      return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#8b5a2b" opacity="0.9" />`;
    })
    .join('');

  const ringOutline = `
    <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="#eaf5e6" stroke="#2d4a2d" stroke-width="3" />
    <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none" stroke="#c2a26a" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.6" />
  `;

  const distLabel = lastSessionDist ? DIST_LABELS[lastSessionDist.type] : 'Unknown';
  const distChart = lastSessionDist
    ? buildDistributionChart(lastSessionDist, completedTrials.map((t) => t.targetAngle), '#8b5a2b')
    : '';
  const allGuessAngles = completedTrials.flatMap((t) => t.guesses.map((g) => g.angle));
  const guessChart = lastSessionDist && allGuessAngles.length > 0
    ? buildDistributionChart(lastSessionDist, allGuessAngles, '#e07b39')
    : '';
  const learningCurveChart = buildLearningCurveChart(attemptsArr);

  // first-throw accuracy: angular distance from each trial's first bomb
  // throw to the nearest true peak of the generating distribution
  const distPeaks = lastSessionDist ? getDistPeaks(lastSessionDist) : [];
  const firstGuessErrors = completedTrials
    .filter((t) => t.guesses.length > 0)
    .map((t) => distanceToNearestPeak(t.guesses[0].angle, distPeaks));
  const firstGuessChart = distPeaks.length > 0 && firstGuessErrors.length > 0
    ? buildFirstGuessAccuracyChart(firstGuessErrors)
    : '';

  // early / middle / late split of all bomb throws, to see whether
  // guessing visibly drifted toward the true distribution over time
  const thirdSize = Math.max(1, Math.ceil(n / 3));
  const earlyTrials = completedTrials.slice(0, thirdSize);
  const middleTrials = completedTrials.slice(thirdSize, thirdSize * 2);
  const lateTrials = completedTrials.slice(thirdSize * 2);
  const earlyGuesses = earlyTrials.flatMap((t) => t.guesses.map((g) => g.angle));
  const middleGuesses = middleTrials.flatMap((t) => t.guesses.map((g) => g.angle));
  const lateGuesses = lateTrials.flatMap((t) => t.guesses.map((g) => g.angle));
  const MINI_W = 330, MINI_H = 130;
  const earlyChart = lastSessionDist && earlyGuesses.length > 0
    ? buildDistributionChart(lastSessionDist, earlyGuesses, '#f4a261', MINI_W, MINI_H)
    : '';
  const middleChart = lastSessionDist && middleGuesses.length > 0
    ? buildDistributionChart(lastSessionDist, middleGuesses, '#e07b39', MINI_W, MINI_H)
    : '';
  const lateChart = lastSessionDist && lateGuesses.length > 0
    ? buildDistributionChart(lastSessionDist, lateGuesses, '#c0392b', MINI_W, MINI_H)
    : '';

  display.innerHTML = `
    <div class="story-box" style="max-width:1100px; text-align:center;">
      <p style="font-size:24px;">🐰 Bard's Hunting Report</p>
      <p style="font-size:16px;">
        Rabbits caught: <b>${n}</b> &nbsp;|&nbsp;
        Mean bombs per catch: <b>${meanAttempts.toFixed(1)}</b> &nbsp;|&nbsp;
        Median: <b>${median}</b> &nbsp;|&nbsp;
        Range: <b>${minAttempts}&ndash;${maxAttempts}</b>
      </p>
      <p style="font-size:14px; margin-top:16px;">Bombs needed to catch each rabbit</p>
      <div class="hist-bar-wrap">${bars_html}</div>
      <div style="display:flex; justify-content:center; gap:4px;">${labels_html}</div>

      <p style="font-size:14px; margin-top:24px;">Learning curve: bombs needed, trial by trial</p>
      <div style="margin-top:6px;">${learningCurveChart}</div>

      ${firstGuessChart ? `
        <p style="font-size:14px; margin-top:24px;">First-throw accuracy: distance to the nearest true hiding hotspot, trial by trial</p>
        <div style="margin-top:6px;">${firstGuessChart}</div>
      ` : ''}

      <p style="font-size:14px; margin-top:24px;">
        The rabbit's favorite hiding spots followed a: <b>${distLabel}</b> distribution
      </p>
      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:6px;">
        <div>
          <p style="font-size:13px;">True rabbit hiding angles</p>
          ${distChart}
        </div>
        <div>
          <p style="font-size:13px;">All bomb throws (hits + misses)</p>
          ${guessChart}
        </div>
      </div>
      <p style="font-size:12px; margin-top:8px;">
        brown bars = true hiding-spot density &nbsp;|&nbsp; orange bars = bomb-throw density &nbsp;|&nbsp;
        dark curve = theoretical generating distribution
      </p>

      ${(earlyChart || middleChart || lateChart) ? `
        <p style="font-size:14px; margin-top:24px;">Did your throws drift toward the true hotspots over time?</p>
        <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:6px;">
          <div>
            <p style="font-size:12px;">Early (trials 1&ndash;${earlyTrials.length})</p>
            ${earlyChart}
          </div>
          <div>
            <p style="font-size:12px;">Middle (trials ${earlyTrials.length + 1}&ndash;${earlyTrials.length + middleTrials.length})</p>
            ${middleChart}
          </div>
          <div>
            <p style="font-size:12px;">Late (trials ${earlyTrials.length + middleTrials.length + 1}&ndash;${n})</p>
            ${lateChart}
          </div>
        </div>
        <p style="font-size:12px; margin-top:6px;">
          bars = empirical throw density for that third of the session &nbsp;|&nbsp; dark curve = theoretical generating distribution
        </p>
      ` : ''}

      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:24px;">
        <div>
          <p style="font-size:14px;">All bomb throws across every trial</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${guess_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#2ecc40;"></span>hit (caught the rabbit)</span>
            <span><span class="legend-dot" style="background:#e74c3c;"></span>miss</span>
          </div>
        </div>

        <div>
          <p style="font-size:14px;">True rabbit location, every trial</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${target_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#8b5a2b;"></span>true rabbit angle (one per trial)</span>
          </div>
        </div>
      </div>

      <p style="font-size:12px; margin-top:20px; color:#4a6a4a;">
        Your data has been downloaded automatically as a CSV.
        <button id="redownload-btn" style="margin-left:8px; padding:4px 10px; border-radius:6px; border:none; background:#4caf50; color:white; cursor:pointer;">
          Download again
        </button>
      </p>
    </div>
  `;

  display.querySelector('#redownload-btn').addEventListener('click', downloadCSV);
  downloadCSV();
}

// ---------- experiment setup ----------
const jsPsych = initJsPsych({
  on_finish: function() {
    const last = jsPsych.data.get().last(1).values()[0];
    if (last && last.selected_distributions) {
      allowedDistTypes = last.selected_distributions;
    }
    startTask();
  }
});
jsPsychInstance = jsPsych;

document.body.insertAdjacentHTML(
  'beforeend',
  '<div id="end-hint">Press ESC at any time to end the task and see your results</div>'
);

const instructions = {
  type: jsPsychHtmlKeyboardResponse,
  choices: 'NO_KEYS',
  stimulus: `
    <div class="story-box">
      <h2 style="margin-top:0;">🌿 Bard the Gardener vs. The Hidden Rabbit 🐰</h2>
      <p>Bard's prize vegetables keep vanishing overnight. He's finally
      cornered the culprit: a rabbit hiding somewhere along the dirt path
      that loops around the garden. Its hiding spot is really just a
      direction, an angle around the circle &mdash; he can't see it under
      the grass.</p>
      <p>Bard has <b>10 bombs</b> in his wheelbarrow. <b>Click</b> anywhere
      in the garden to have him toss a bomb in that direction &mdash; it
      always lands out on the path. Each blast will tell you if you got the
      rabbit or not.</p>
      <p>If Bard runs through all 10 bombs without catching it, he'll just
      grab 10 more and keep going &mdash; the hunt for that rabbit
      continues until it's caught. Once caught, a new rabbit sneaks in and
      hides somewhere else, and the hunt begins again.</p>
      <p>The rabbit doesn't hide completely at random &mdash; it has
      favorite spots in the garden, though you won't know what they are
      until the end.</p>
      <p>Try to catch each rabbit using as few bombs as possible.</p>
      <p style="color:#555;">You can press <b>ESC</b> at any time to end
      the hunt and see Bard's report.</p>

      <p style="font-weight:bold; margin-top:18px; margin-bottom:6px;">
        Choose which kinds of hiding-spot distributions the rabbit might use
        (pick one or more):
      </p>
      <div id="dist-checkboxes" style="display:flex; flex-wrap:wrap; gap:14px;">
        ${DIST_CHOICE_ORDER.map(
          (key) => `
          <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
            <input type="checkbox" class="dist-choice" value="${key}" checked>
            ${DIST_LABELS[key]}
          </label>
        `
        ).join('')}
      </div>
      <p id="dist-error" style="color:#c0392b; font-size:12px; display:none; margin-top:6px;">
        Select at least one distribution type.
      </p>
      <button id="start-hunt-btn" style="margin-top:14px; padding:10px 24px; font-size:16px;
        border-radius:8px; border:none; background:#4caf50; color:white; cursor:pointer;">
        Start the Hunt
      </button>
    </div>
  `,
  on_load: function() {
    const btn = document.getElementById('start-hunt-btn');
    btn.addEventListener('click', function() {
      const checked = Array.from(document.querySelectorAll('.dist-choice:checked')).map((el) => el.value);
      if (checked.length === 0) {
        document.getElementById('dist-error').style.display = 'block';
        return;
      }
      jsPsych.finishTrial({ selected_distributions: checked });
    });
  },
};

jsPsych.run([instructions]);

</script>
</html>
