<!DOCTYPE html>
<html>
<head>
  <title>Escape the Bombs: Play as the Rabbit</title>
  <script src="https://unpkg.com/jspsych@8.2.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { image-rendering: pixelated; }
    body {
      background-color: #2a1a3c;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 16px 16px;
      font-family: "Press Start 2P", monospace;
    }
    .jspsych-display-element { color: #ffe0f0; }
    h1.title {
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 0;
      color: #ff8fc0;
      text-shadow: 3px 3px 0 #000;
    }
    #scoreboard {
      text-align: center;
      font-size: 10px;
      line-height: 1.8;
      margin-top: 14px;
      color: #7ee8fa;
      text-shadow: 2px 2px 0 #000;
    }
    #bomb-tray {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
      font-size: 20px;
    }
    .bomb-slot { opacity: 1; transition: opacity 0.2s; }
    .bomb-slot.used { opacity: 0.15; }
    #field-box {
      position: relative;
      width: 520px;
      height: 520px;
      margin: 16px auto;
      cursor: crosshair;
    }
    .bomb-icon {
      position: absolute;
      font-size: 26px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: bomb-drop 0.25s ease-out;
    }
    @keyframes bomb-drop {
      0% { transform: translate(-50%, -80%) scale(0.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .explosion-icon {
      position: absolute;
      font-size: 40px;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      opacity: 1;
      animation: boom 0.5s ease-out forwards;
    }
    @keyframes boom {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      60% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
    }
    .rabbit-icon {
      position: absolute;
      font-size: 34px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.3s, opacity 0.5s;
    }
    .rabbit-icon.caught {
      animation: rabbit-shake 0.4s ease-in-out;
    }
    @keyframes rabbit-shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(-15deg); }
      75% { transform: translate(-50%, -50%) rotate(15deg); }
    }
    .callout-text {
      position: absolute;
      font-size: 11px;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      transition: opacity 0.7s, transform 0.7s;
      text-shadow: 2px 2px 0 #000;
      font-family: "Press Start 2P", monospace;
    }
    #result-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 20px;
      border: 3px solid #000;
      font-size: 12px;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: center;
      z-index: 20;
    }
    #result-banner.show { opacity: 1; }
    #result-banner.survived { background: #1a1a2e; color: #7cff8a; box-shadow: 0 0 0 3px #7cff8a, 6px 6px 0 0 #000; }
    #result-banner.caught { background: #1a1a2e; color: #ff5e5e; box-shadow: 0 0 0 3px #ff5e5e, 6px 6px 0 0 #000; }
    #end-hint {
      position: fixed;
      bottom: 10px;
      right: 14px;
      color: #7ee8fa;
      font-size: 9px;
      z-index: 1000;
      text-shadow: 2px 2px 0 #000;
    }
    .hist-bar-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 160px;
      margin: 20px auto 0 auto;
    }
    .hist-bar {
      width: 28px;
      background: #ff8fc0;
      border: 2px solid #000;
    }
    .hist-label {
      font-size: 9px;
      color: #ffe0f0;
      text-align: center;
      width: 28px;
    }
    .recap-legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
      font-size: 9px;
      color: #ffe0f0;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #000;
      margin-right: 6px;
      vertical-align: middle;
    }
    .story-box {
      max-width: 620px;
      margin: 0 auto;
      text-align: left;
      background: #3d2a52;
      border: 4px solid #000;
      box-shadow: 0 0 0 4px #ff8fc0, 8px 8px 0 0 #000;
      padding: 20px 24px;
      font-size: 10px;
      line-height: 1.9;
      color: #ffe0f0;
    }
    .story-box h2 { font-size: 13px; line-height: 1.8; color: #ff8fc0; text-shadow: 2px 2px 0 #000; }
    .story-box button {
      font-family: "Press Start 2P", monospace;
      border-radius: 0 !important;
      border: 3px solid #000 !important;
      box-shadow: 4px 4px 0 0 #000;
    }
  </style>
</head>
<body></body>
<script>

// ---------- geometry ----------
const CENTER = 260;
const FIELD_RADIUS = 230;
const PATH_RADIUS = FIELD_RADIUS - 40;
const PATH_WIDTH = 26;

const RABBIT_HIDE_ARC_DEG = 12;       // how "wide" the rabbit's hiding spot is
const BOMB_BLAST_TOLERANCE_DEG = 8;   // a little extra forgiveness on blast radius
const HIT_TOLERANCE_DEG = RABBIT_HIDE_ARC_DEG / 2 + BOMB_BLAST_TOLERANCE_DEG;

const N_BOMBS = 10;

function xyToAngle(x, y) {
  const dx = x - CENTER;
  const dy = y - CENTER;
  let deg = (Math.atan2(dx, -dy) * 180) / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function angleToXY(angleDeg, radius) {
  const rad = (angleDeg * Math.PI) / 180;
  return {
    x: CENTER + radius * Math.sin(rad),
    y: CENTER - radius * Math.cos(rad),
  };
}

function circularDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function wrapAngle(a) {
  return ((a % 360) + 360) % 360;
}

// ---------- random number / PDF helpers ----------
function gaussianRandom(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return mean + z * std;
}

function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}

function stdNormalPDF(z) {
  return Math.exp((-z * z) / 2) / Math.sqrt(2 * Math.PI);
}

function stdNormalCDF(z) {
  return 0.5 * (1 + erf(z / Math.sqrt(2)));
}

function skewNormalRandom(mean, std, alpha) {
  const delta = alpha / Math.sqrt(1 + alpha * alpha);
  const u0 = gaussianRandom(0, 1);
  const v = gaussianRandom(0, 1);
  const u1 = delta * u0 + Math.sqrt(1 - delta * delta) * v;
  const z = u0 >= 0 ? u1 : -u1;
  return mean + std * z;
}

function gaussianPDFraw(x, mean, std) {
  return stdNormalPDF((x - mean) / std) / std;
}

function skewNormalPDFraw(x, mean, std, alpha) {
  const z = (x - mean) / std;
  return (2 / std) * stdNormalPDF(z) * stdNormalCDF(alpha * z);
}

function uniformPDFraw(x, low, high) {
  return x >= low && x <= high ? 1 / (high - low) : 0;
}

function weightedChoice(weights) {
  const r = Math.random();
  let cum = 0;
  for (let i = 0; i < weights.length; i++) {
    cum += weights[i];
    if (r <= cum) return i;
  }
  return weights.length - 1;
}

function sampleModes(numModes, minSepDeg) {
  const modes = [];
  let guard = 0;
  while (modes.length < numModes && guard < 500) {
    guard++;
    const candidate = Math.random() * 360;
    if (modes.every((m) => circularDist(m, candidate) >= minSepDeg)) {
      modes.push(candidate);
    }
  }
  while (modes.length < numModes) {
    modes.push((360 / numModes) * modes.length);
  }
  return modes;
}

// ---------- Bard's hidden bomb-targeting distribution ----------
// Chosen once per task run and hidden until the end: Bard doesn't drop
// bombs uniformly around the whole garden, he has favorite spots to
// search. Learn to avoid them!
const DIST_MAKERS = {
  gaussian: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    return { type: 'gaussian', mean, std };
  },
  uniform: () => {
    const center = Math.random() * 360;
    const halfWidth = 30 + Math.random() * 60;
    return { type: 'uniform', low: center - halfWidth, high: center + halfWidth, center, halfWidth };
  },
  bimodal: () => {
    const centers = sampleModes(2, 90);
    const w1 = 0.35 + Math.random() * 0.3;
    const weights = [w1, 1 - w1];
    const modes = centers.map((mean, i) => ({
      mean,
      std: 10 + Math.random() * 12,
      weight: weights[i],
    }));
    return { type: 'bimodal', modes };
  },
  multimodal: () => {
    const k = 3 + (Math.random() < 0.5 ? 0 : 1);
    const centers = sampleModes(k, 55);
    const rawWeights = centers.map(() => 0.5 + Math.random());
    const sumW = rawWeights.reduce((a, b) => a + b, 0);
    const modes = centers.map((mean, i) => ({
      mean,
      std: 8 + Math.random() * 10,
      weight: rawWeights[i] / sumW,
    }));
    return { type: 'multimodal', modes };
  },
  skewed: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    const magnitude = 3 + Math.random() * 4;
    const alpha = Math.random() < 0.5 ? -magnitude : magnitude;
    return { type: 'skewed', mean, std, alpha };
  },
  // uniform over a range, but with an elevated "hotspot" bump somewhere
  // inside that range -- mostly flat, with one peak
  peaked: () => {
    const rangeCenter = Math.random() * 360;
    const rangeHalfWidth = 40 + Math.random() * 40; // range width 80-160 deg
    const low = rangeCenter - rangeHalfWidth;
    const high = rangeCenter + rangeHalfWidth;
    const peakOffset = (Math.random() * 2 - 1) * rangeHalfWidth * 0.6;
    const peakLocation = wrapAngle(rangeCenter + peakOffset);
    const peakStd = 8 + Math.random() * 10;
    const peakWeight = 0.4 + Math.random() * 0.3;
    return { type: 'peaked', low, high, peakLocation, peakStd, peakWeight };
  },
};

const DIST_LABELS = {
  gaussian: 'Gaussian',
  uniform: 'Uniform',
  bimodal: 'Bimodal',
  multimodal: 'Multimodal',
  skewed: 'Skewed',
  peaked: 'Peaked (uniform + hotspot)',
};

const DIST_CHOICE_ORDER = ['gaussian', 'uniform', 'bimodal', 'multimodal', 'skewed', 'peaked'];
let allowedDistTypes = Object.keys(DIST_MAKERS);

function makeSessionDist() {
  const keys = allowedDistTypes && allowedDistTypes.length > 0 ? allowedDistTypes : Object.keys(DIST_MAKERS);
  const key = keys[Math.floor(Math.random() * keys.length)];
  return DIST_MAKERS[key]();
}

function drawFromDist(distParams) {
  switch (distParams.type) {
    case 'gaussian':
      return wrapAngle(gaussianRandom(distParams.mean, distParams.std));
    case 'uniform':
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    case 'bimodal':
    case 'multimodal': {
      const idx = weightedChoice(distParams.modes.map((m) => m.weight));
      const m = distParams.modes[idx];
      return wrapAngle(gaussianRandom(m.mean, m.std));
    }
    case 'skewed':
      return wrapAngle(skewNormalRandom(distParams.mean, distParams.std, distParams.alpha));
    case 'peaked': {
      if (Math.random() < distParams.peakWeight) {
        return wrapAngle(gaussianRandom(distParams.peakLocation, distParams.peakStd));
      }
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    }
    default:
      return Math.random() * 360;
  }
}

function marginalPDF(distParams, xWrapped) {
  let total = 0;
  for (let k = -1; k <= 1; k++) {
    const x = xWrapped + 360 * k;
    if (distParams.type === 'gaussian') {
      total += gaussianPDFraw(x, distParams.mean, distParams.std);
    } else if (distParams.type === 'uniform') {
      total += uniformPDFraw(x, distParams.low, distParams.high);
    } else if (distParams.type === 'bimodal' || distParams.type === 'multimodal') {
      distParams.modes.forEach((m) => {
        total += m.weight * gaussianPDFraw(x, m.mean, m.std);
      });
    } else if (distParams.type === 'skewed') {
      total += skewNormalPDFraw(x, distParams.mean, distParams.std, distParams.alpha);
    } else if (distParams.type === 'peaked') {
      total += distParams.peakWeight * gaussianPDFraw(x, distParams.peakLocation, distParams.peakStd);
      total += (1 - distParams.peakWeight) * uniformPDFraw(x, distParams.low, distParams.high);
    }
  }
  return total;
}

function buildDistributionChart(distParams, angles, barColor) {
  const nBins = 24;
  const binWidth = 360 / nBins;
  const counts = new Array(nBins).fill(0);
  angles.forEach((a) => {
    let idx = Math.floor(a / binWidth);
    if (idx >= nBins) idx = nBins - 1;
    counts[idx]++;
  });
  const n = angles.length;
  const density = counts.map((c) => c / (n * binWidth));

  const curvePts = [];
  for (let x = 0; x < 360; x += 2) {
    curvePts.push({ x, d: marginalPDF(distParams, x) });
  }

  const maxScale = Math.max(...density, ...curvePts.map((p) => p.d), 1e-6) * 1.15;
  const CH_W = 720, CH_H = 160;
  const barW = CH_W / nBins;

  const bars = density
    .map((d, i) => {
      const h = (d / maxScale) * CH_H;
      const x = i * barW;
      return `<rect x="${x}" y="${CH_H - h}" width="${barW - 1}" height="${h}" fill="${barColor}" opacity="0.6" />`;
    })
    .join('');

  const linePts = curvePts
    .map((p) => {
      const x = (p.x / 360) * CH_W;
      const y = CH_H - (p.d / maxScale) * CH_H;
      return `${x},${y}`;
    })
    .join(' ');

  return `
    <svg width="${CH_W}" height="${CH_H}" style="background:#1a1030; border:3px solid #000;">
      ${bars}
      <polyline points="${linePts}" fill="none" stroke="#6b3f57" stroke-width="2" />
    </svg>
    <div style="display:flex; justify-content:space-between; width:${CH_W}px; margin:2px auto 0 auto; font-size:9px; color:#ffe0f0;">
      <span>0&deg;</span><span>90&deg;</span><span>180&deg;</span><span>270&deg;</span><span>360&deg;</span>
    </div>
  `;
}

// ---------- meadow field background art ----------
function buildFieldSVG() {
  // little flowers/clover scattered near the path, generated once so
  // they don't flicker between renders. Purely decorative.
  let deco = '';
  const nDeco = 90;
  const petals = ['🌸', '🌼', '🍀'];
  for (let i = 0; i < nDeco; i++) {
    const r = PATH_RADIUS + (Math.random() - 0.5) * (PATH_WIDTH + 30);
    const theta = Math.random() * Math.PI * 2;
    const x = CENTER + r * Math.cos(theta);
    const y = CENTER + r * Math.sin(theta);
    const size = 10 + Math.random() * 6;
    const emoji = petals[Math.floor(Math.random() * petals.length)];
    deco += `<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle" opacity="0.8">${emoji}</text>`;
  }

  return `
    <svg width="520" height="520" style="position:absolute; top:0; left:0;">
      <defs>
        <radialGradient id="meadowGrad" cx="50%" cy="45%" r="65%">
          <stop offset="0%" stop-color="#eafff0" />
          <stop offset="100%" stop-color="#bdeacb" />
        </radialGradient>
      </defs>
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="url(#meadowGrad)" stroke="#b5548a" stroke-width="4" />
      ${deco}
      <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none"
              stroke="#f2c6a0" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.9" />
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="none" stroke="#b5548a" stroke-width="4" />
    </svg>
  `;
}

// ---------- global state ----------
let jsPsychInstance;
let lastSessionDist = null;
const completedTrials = []; // { trial, hidingAngle, bombs: [angle...], hitAngles: [angle...], survived }

function startTask() {
  const display = jsPsychInstance.getDisplayElement();

  display.innerHTML = `
    <h1 class="title">🐰 Escape the Bombs! 🌸</h1>
    <div id="scoreboard"></div>
    <div id="bomb-tray"></div>
    <div id="field-box">
      ${buildFieldSVG()}
      <div id="result-banner"></div>
    </div>
  `;

  const fieldBox = display.querySelector('#field-box');
  const scoreboard = display.querySelector('#scoreboard');
  const bombTray = display.querySelector('#bomb-tray');
  const resultBanner = display.querySelector('#result-banner');

  const sessionDist = makeSessionDist();
  lastSessionDist = sessionDist;

  let phase = 'choosing'; // 'choosing' | 'bombing'
  let trialStartTime = performance.now();

  function updateScoreboard() {
    const n = completedTrials.length;
    const survived = completedTrials.filter((t) => t.survived).length;
    const rate = n > 0 ? Math.round((survived / n) * 100) : 0;
    const bombsShown = phase === 'bombing' ? currentBombCount : 0;
    scoreboard.textContent =
      `Trial ${n + 1} | Bombs dropped this trial: ${bombsShown}/${N_BOMBS} | Survived: ${survived}/${n} (${rate}%)`;
  }

  function renderBombTray(remaining) {
    let html = '';
    for (let i = 0; i < N_BOMBS; i++) {
      const dropped = i < N_BOMBS - remaining;
      html += `<span class="bomb-slot${dropped ? ' used' : ''}">💣</span>`;
    }
    bombTray.innerHTML = html;
  }

  function showResultBanner(survived) {
    resultBanner.textContent = survived ? 'You escaped! 🐰✨' : "Bard got you! 💥";
    resultBanner.className = survived ? 'show survived' : 'show caught';
    setTimeout(() => {
      resultBanner.classList.remove('show');
    }, 1100);
  }

  function showCallout(p, text, color) {
    const el = document.createElement('div');
    el.className = 'callout-text';
    el.textContent = text;
    el.style.color = color;
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y - 30}px`;
    fieldBox.appendChild(el);
    requestAnimationFrame(() => {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%, -60%)';
    });
    setTimeout(() => el.remove(), 750);
  }

  let currentBombCount = 0;
  let rabbitEl = null;
  let hidingAngle = null;
  let hidingPoint = null;
  let bombAngles = [];
  let anyHit = false;

  function placeRabbitBurrow(p) {
    rabbitEl = document.createElement('div');
    rabbitEl.className = 'rabbit-icon';
    rabbitEl.textContent = '🕳️';
    rabbitEl.style.left = `${p.x}px`;
    rabbitEl.style.top = `${p.y}px`;
    fieldBox.appendChild(rabbitEl);
  }

  function revealRabbit(caught) {
    if (!rabbitEl) return;
    rabbitEl.textContent = '🐰';
    if (caught) rabbitEl.classList.add('caught');
  }

  function dropBomb(index) {
    const bombAngle = drawFromDist(sessionDist);
    bombAngles.push(bombAngle);
    const p = angleToXY(bombAngle, PATH_RADIUS);
    const gotHit = circularDist(bombAngle, hidingAngle) <= HIT_TOLERANCE_DEG;
    if (gotHit) anyHit = true;

    const bomb = document.createElement('div');
    bomb.className = 'bomb-icon';
    bomb.textContent = '💣';
    bomb.style.left = `${p.x}px`;
    bomb.style.top = `${p.y}px`;
    fieldBox.appendChild(bomb);

    setTimeout(() => {
      bomb.remove();
      const boom = document.createElement('div');
      boom.className = 'explosion-icon';
      boom.textContent = '💥';
      boom.style.left = `${p.x}px`;
      boom.style.top = `${p.y}px`;
      fieldBox.appendChild(boom);
      if (gotHit) revealRabbit(true);

      setTimeout(() => {
        boom.remove();
        currentBombCount = index + 1;
        renderBombTray(N_BOMBS - currentBombCount);
        updateScoreboard();

        if (index + 1 < N_BOMBS) {
          setTimeout(() => dropBomb(index + 1), 120);
        } else {
          finishTrial();
        }
      }, 420);
    }, 220);
  }

  function finishTrial() {
    const survived = !anyHit;
    if (!survived) revealRabbit(true);
    else if (rabbitEl) rabbitEl.textContent = '🐰';
    showResultBanner(survived);

    const rt = performance.now() - trialStartTime;
    completedTrials.push({
      trial: completedTrials.length + 1,
      hidingAngle: hidingAngle,
      bombs: bombAngles,
      survived: survived,
      rt: rt,
    });

    setTimeout(() => {
      if (rabbitEl) { rabbitEl.remove(); rabbitEl = null; }
      hidingAngle = null;
      hidingPoint = null;
      bombAngles = [];
      anyHit = false;
      currentBombCount = 0;
      phase = 'choosing';
      trialStartTime = performance.now();
      renderBombTray(N_BOMBS);
      updateScoreboard();
    }, 1000);
  }

  function onFieldClick(evt) {
    if (phase !== 'choosing') return;
    const rect = fieldBox.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    const dx = x - CENTER, dy = y - CENTER;
    if (Math.sqrt(dx * dx + dy * dy) > FIELD_RADIUS) return; // must click inside the meadow

    // the hiding space is 1D: only the click's angle matters. The rabbit
    // always burrows on the path ring at that angle.
    hidingAngle = xyToAngle(x, y);
    hidingPoint = angleToXY(hidingAngle, PATH_RADIUS);
    placeRabbitBurrow(hidingPoint);
    showCallout(hidingPoint, "You're hiding here!", '#4caf50');

    phase = 'bombing';
    setTimeout(() => dropBomb(0), 500);
  }

  function cleanupListeners() {
    fieldBox.removeEventListener('click', onFieldClick);
    document.removeEventListener('keydown', onKeydown);
  }

  const onKeydown = (evt) => {
    if (evt.key === 'Escape') {
      cleanupListeners();
      showAnalysisScreen();
    }
  };

  fieldBox.addEventListener('click', onFieldClick);
  document.addEventListener('keydown', onKeydown);

  renderBombTray(N_BOMBS);
  updateScoreboard();
}

// ---------- analysis screen (ESC ends the task) ----------
function showAnalysisScreen() {
  const display = jsPsychInstance.getDisplayElement();

  if (completedTrials.length === 0) {
    display.innerHTML = `
      <div class="story-box" style="margin-top:60px;">
        <p style="font-size:22px;">🐰 Task ended.</p>
        <p>No trials were completed before ending.</p>
      </div>
    `;
    return;
  }

  const n = completedTrials.length;
  const survivedCount = completedTrials.filter((t) => t.survived).length;
  const survivalRate = Math.round((survivedCount / n) * 100);

  const ringOutline = `
    <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="#fff0f6" stroke="#b5548a" stroke-width="3" />
    <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none" stroke="#f2c6a0" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.6" />
  `;

  const bomb_dots = completedTrials
    .flatMap((t) => t.bombs)
    .map((a) => {
      const p = angleToXY(a, PATH_RADIUS);
      return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#e74c3c" opacity="0.7" />`;
    })
    .join('');

  const hiding_dots = completedTrials
    .map((t) => {
      const p = angleToXY(t.hidingAngle, PATH_RADIUS);
      return `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${t.survived ? '#4caf50' : '#e74c3c'}" opacity="0.9" />`;
    })
    .join('');

  const distLabel = lastSessionDist ? DIST_LABELS[lastSessionDist.type] : 'Unknown';
  const bombChart = lastSessionDist
    ? buildDistributionChart(lastSessionDist, completedTrials.flatMap((t) => t.bombs), '#e74c3c')
    : '';
  const hidingChart = lastSessionDist
    ? buildDistributionChart(lastSessionDist, completedTrials.map((t) => t.hidingAngle), '#ff8fc0')
    : '';

  display.innerHTML = `
    <div class="story-box" style="max-width:1100px; text-align:center;">
      <p style="font-size:24px;">🐰 Your Escape Report</p>
      <p style="font-size:16px;">
        Trials played: <b>${n}</b> &nbsp;|&nbsp;
        Times survived: <b>${survivedCount}</b> &nbsp;|&nbsp;
        Survival rate: <b>${survivalRate}%</b>
      </p>

      <p style="font-size:14px; margin-top:24px;">
        Bard's bombs followed a: <b>${distLabel}</b> distribution (hidden from you during play)
      </p>
      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:6px;">
        <div>
          <p style="font-size:13px;">Where the bombs actually landed</p>
          ${bombChart}
        </div>
        <div>
          <p style="font-size:13px;">Where you chose to hide</p>
          ${hidingChart}
        </div>
      </div>
      <p style="font-size:12px; margin-top:8px;">
        red bars = bomb-landing density &nbsp;|&nbsp; pink bars = your hiding-spot density &nbsp;|&nbsp;
        dark curve = theoretical generating distribution
      </p>

      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:24px;">
        <div>
          <p style="font-size:14px;">All bomb landings across every trial</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${bomb_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#e74c3c;"></span>bomb landing spot</span>
          </div>
        </div>

        <div>
          <p style="font-size:14px;">Where you hid, every trial</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${hiding_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#4caf50;"></span>survived</span>
            <span><span class="legend-dot" style="background:#e74c3c;"></span>caught</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ---------- experiment setup ----------
