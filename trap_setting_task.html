<!DOCTYPE html>
<html>
<head>
  <title>Trap Setting: Bard's Twilight Hunt</title>
  <script src="https://unpkg.com/jspsych@8.2.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    * { image-rendering: pixelated; box-sizing: border-box; }
    body {
      background-color: #4a3410;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 16px 16px;
      transition: background-color 0.8s;
      font-family: "Press Start 2P", monospace;
      margin: 0;
      padding: 12px 10px 40px 10px;
      overflow-x: hidden;
    }
    body.twilight {
      background-color: #2a1a4a;
    }
    .jspsych-display-element { color: #ffe9b3; }
    body.twilight .jspsych-display-element { color: #e0d0f5; }
    h1.title {
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 0;
      color: #ffd700;
      text-shadow: 3px 3px 0 #000;
    }
    body.twilight h1.title { color: #f4c76b; }
    #scoreboard {
      text-align: center;
      font-size: 10px;
      line-height: 1.8;
      margin-top: 14px;
      color: #ffe9b3;
      text-shadow: 2px 2px 0 #000;
    }
    body.twilight #scoreboard { color: #d8c8f0; }
    #trap-tray {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
      font-size: 20px;
    }
    .trap-slot { opacity: 0.25; transition: opacity 0.2s; }
    .trap-slot.placed { opacity: 1; }
    #field-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 16px auto;
      overflow: hidden;
    }
    #field-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 520px;
      height: 520px;
      cursor: crosshair;
      transform-origin: top left;
    }
    #end-game-btn {
      display: block;
      margin: 14px auto 0 auto;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      padding: 10px 16px;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 0 #000;
      background: #ff5e5e;
      color: #000;
      cursor: pointer;
      border-radius: 0;
    }
    @media (max-width: 480px) {
      h1.title { font-size: 13px; }
      #scoreboard { font-size: 8px; }
      .story-box { font-size: 11px; padding: 16px 16px; }
      .story-box h2 { font-size: 14px; }
    }
    .trap-icon {
      position: absolute;
      font-size: 28px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: trap-pop 0.25s ease-out;
      filter: brightness(0);
    }
    @keyframes trap-pop {
      0% { transform: translate(-50%, -70%) scale(0.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .trap-icon.sprung {
      animation: trap-snap 0.35s ease-in-out;
    }
    @keyframes trap-snap {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      40% { transform: translate(-50%, -50%) scale(1.4) rotate(-10deg); }
      70% { transform: translate(-50%, -50%) scale(1.4) rotate(10deg); }
    }
    .rabbit-icon {
      position: absolute;
      font-size: 30px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: rabbit-pop 0.3s ease-out;
    }
    @keyframes rabbit-pop {
      0% { transform: translate(-50%, -20%) scale(0.3); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .rabbit-icon.caught {
      animation: rabbit-shake 0.4s ease-in-out;
    }
    @keyframes rabbit-shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(-16deg); }
      75% { transform: translate(-50%, -50%) rotate(16deg); }
    }
    .poof-icon {
      position: absolute;
      font-size: 30px;
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
      opacity: 1;
      animation: poof 0.5s ease-out forwards;
    }
    @keyframes poof {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(1.3); opacity: 0; }
    }
    .callout-text {
      position: absolute;
      font-size: 11px;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      transition: opacity 0.7s, transform 0.7s;
      text-shadow: 2px 2px 0 #000;
      font-family: "Press Start 2P", monospace;
    }
    #result-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a2e;
      border: 3px solid #000;
      box-shadow: 0 0 0 3px #ffd700, 6px 6px 0 0 #000;
      padding: 14px 20px;
      font-size: 12px;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: center;
      z-index: 20;
    }
    #result-banner.show { opacity: 1; }
    #phase-banner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translate(-50%, 0);
      background: #1a1200;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 0 #000;
      color: #ffe9b3;
      padding: 6px 14px;
      font-size: 10px;
      z-index: 20;
    }
    body.twilight #phase-banner {
      background: #1a1030;
      color: #f4c76b;
    }
    .hist-bar-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 160px;
      margin: 20px auto 0 auto;
    }
    .hist-bar {
      width: 28px;
      background: #d97a5f;
      border: 2px solid #000;
    }
    .hist-label {
      font-size: 9px;
      color: #ffe9b3;
      text-align: center;
      width: 28px;
    }
    .recap-legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
      font-size: 9px;
      color: #ffe9b3;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #000;
      margin-right: 6px;
      vertical-align: middle;
    }
    .story-box {
      max-width: 640px;
      margin: 0 auto;
      text-align: left;
      background: #5a3e1b;
      border: 4px solid #000;
      box-shadow: 0 0 0 4px #ffd700, 8px 8px 0 0 #000;
      padding: 22px 26px;
      font-size: 13px;
      line-height: 2.1;
      color: #ffe9b3;
    }
    .story-box h2 { font-size: 17px; line-height: 1.8; color: #ffd700; text-shadow: 2px 2px 0 #000; }
    .story-box button {
      font-family: "Press Start 2P", monospace;
      border-radius: 0 !important;
      border: 3px solid #000 !important;
      box-shadow: 4px 4px 0 0 #000;
    }
  </style>
</head>
<body></body>
<script>

// ---------- geometry ----------
const CENTER = 260;
const FIELD_RADIUS = 230;
const PATH_RADIUS = FIELD_RADIUS - 40;
const PATH_WIDTH = 26;

const RABBIT_HITBOX_ARC_DEG = 12;    // how "exposed" a rabbit is when it pops up
const TRAP_CATCH_TOLERANCE_DEG = 8;  // a little forgiveness on trap catch radius
const CATCH_TOLERANCE_DEG = RABBIT_HITBOX_ARC_DEG / 2 + TRAP_CATCH_TOLERANCE_DEG;

const N_TRAPS = 5;
const N_RABBITS_PER_ROUND = N_TRAPS;

function xyToAngle(x, y) {
  const dx = x - CENTER;
  const dy = y - CENTER;
  let deg = (Math.atan2(dx, -dy) * 180) / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function angleToXY(angleDeg, radius) {
  const rad = (angleDeg * Math.PI) / 180;
  return {
    x: CENTER + radius * Math.sin(rad),
    y: CENTER - radius * Math.cos(rad),
  };
}

function circularDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function wrapAngle(a) {
  return ((a % 360) + 360) % 360;
}

// ---------- random number / PDF helpers ----------
function gaussianRandom(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return mean + z * std;
}

function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}

function stdNormalPDF(z) {
  return Math.exp((-z * z) / 2) / Math.sqrt(2 * Math.PI);
}

function stdNormalCDF(z) {
  return 0.5 * (1 + erf(z / Math.sqrt(2)));
}

function skewNormalRandom(mean, std, alpha) {
  const delta = alpha / Math.sqrt(1 + alpha * alpha);
  const u0 = gaussianRandom(0, 1);
  const v = gaussianRandom(0, 1);
  const u1 = delta * u0 + Math.sqrt(1 - delta * delta) * v;
  const z = u0 >= 0 ? u1 : -u1;
  return mean + std * z;
}

function gaussianPDFraw(x, mean, std) {
  return stdNormalPDF((x - mean) / std) / std;
}

function skewNormalPDFraw(x, mean, std, alpha) {
  const z = (x - mean) / std;
  return (2 / std) * stdNormalPDF(z) * stdNormalCDF(alpha * z);
}

function uniformPDFraw(x, low, high) {
  return x >= low && x <= high ? 1 / (high - low) : 0;
}

function weightedChoice(weights) {
  const r = Math.random();
  let cum = 0;
  for (let i = 0; i < weights.length; i++) {
    cum += weights[i];
    if (r <= cum) return i;
  }
  return weights.length - 1;
}

function sampleModes(numModes, minSepDeg) {
  const modes = [];
  let guard = 0;
  while (modes.length < numModes && guard < 500) {
    guard++;
    const candidate = Math.random() * 360;
    if (modes.every((m) => circularDist(m, candidate) >= minSepDeg)) {
      modes.push(candidate);
    }
  }
  while (modes.length < numModes) {
    modes.push((360 / numModes) * modes.length);
  }
  return modes;
}

// ---------- the rabbits' hidden spawn distribution ----------
// Chosen once per task run (from whichever families the player allows on
// the setup screen) and hidden until the end: rabbits don't pop up
// uniformly around the whole meadow, they have favorite spots.
const DIST_MAKERS = {
  gaussian: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    return { type: 'gaussian', mean, std };
  },
  uniform: () => {
    const center = Math.random() * 360;
    const halfWidth = 30 + Math.random() * 60;
    return { type: 'uniform', low: center - halfWidth, high: center + halfWidth, center, halfWidth };
  },
  bimodal: () => {
    const centers = sampleModes(2, 90);
    const w1 = 0.35 + Math.random() * 0.3;
    const weights = [w1, 1 - w1];
    const modes = centers.map((mean, i) => ({
      mean,
      std: 10 + Math.random() * 12,
      weight: weights[i],
    }));
    return { type: 'bimodal', modes };
  },
  multimodal: () => {
    const k = 3 + (Math.random() < 0.5 ? 0 : 1);
    const centers = sampleModes(k, 55);
    const rawWeights = centers.map(() => 0.5 + Math.random());
    const sumW = rawWeights.reduce((a, b) => a + b, 0);
    const modes = centers.map((mean, i) => ({
      mean,
      std: 8 + Math.random() * 10,
      weight: rawWeights[i] / sumW,
    }));
    return { type: 'multimodal', modes };
  },
  skewed: () => {
    const mean = Math.random() * 360;
    const std = 15 + Math.random() * 20;
    const magnitude = 3 + Math.random() * 4;
    const alpha = Math.random() < 0.5 ? -magnitude : magnitude;
    return { type: 'skewed', mean, std, alpha };
  },
  // uniform over a range, but with an elevated "hotspot" bump somewhere
  // inside that range -- mostly flat, with one peak
  peaked: () => {
    const rangeCenter = Math.random() * 360;
    const rangeHalfWidth = 40 + Math.random() * 40; // range width 80-160 deg
    const low = rangeCenter - rangeHalfWidth;
    const high = rangeCenter + rangeHalfWidth;
    const peakOffset = (Math.random() * 2 - 1) * rangeHalfWidth * 0.6;
    const peakLocation = wrapAngle(rangeCenter + peakOffset);
    const peakStd = 8 + Math.random() * 10;
    const peakWeight = 0.4 + Math.random() * 0.3;
    return { type: 'peaked', low, high, peakLocation, peakStd, peakWeight };
  },
};

const DIST_LABELS = {
  gaussian: 'Gaussian',
  uniform: 'Uniform',
  bimodal: 'Bimodal',
  multimodal: 'Multimodal',
  skewed: 'Skewed',
  peaked: 'Peaked (uniform + hotspot)',
};

const DIST_CHOICE_ORDER = ['gaussian', 'uniform', 'bimodal', 'multimodal', 'skewed', 'peaked'];

let allowedDistTypes = Object.keys(DIST_MAKERS);

function makeSessionDist() {
  const keys = allowedDistTypes && allowedDistTypes.length > 0 ? allowedDistTypes : Object.keys(DIST_MAKERS);
  const key = keys[Math.floor(Math.random() * keys.length)];
  return DIST_MAKERS[key]();
}

function drawFromDist(distParams) {
  switch (distParams.type) {
    case 'gaussian':
      return wrapAngle(gaussianRandom(distParams.mean, distParams.std));
    case 'uniform':
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    case 'bimodal':
    case 'multimodal': {
      const idx = weightedChoice(distParams.modes.map((m) => m.weight));
      const m = distParams.modes[idx];
      return wrapAngle(gaussianRandom(m.mean, m.std));
    }
    case 'skewed':
      return wrapAngle(skewNormalRandom(distParams.mean, distParams.std, distParams.alpha));
    case 'peaked': {
      if (Math.random() < distParams.peakWeight) {
        return wrapAngle(gaussianRandom(distParams.peakLocation, distParams.peakStd));
      }
      return wrapAngle(distParams.low + Math.random() * (distParams.high - distParams.low));
    }
    default:
      return Math.random() * 360;
  }
}

function marginalPDF(distParams, xWrapped) {
  let total = 0;
  for (let k = -1; k <= 1; k++) {
    const x = xWrapped + 360 * k;
    if (distParams.type === 'gaussian') {
      total += gaussianPDFraw(x, distParams.mean, distParams.std);
    } else if (distParams.type === 'uniform') {
      total += uniformPDFraw(x, distParams.low, distParams.high);
    } else if (distParams.type === 'bimodal' || distParams.type === 'multimodal') {
      distParams.modes.forEach((m) => {
        total += m.weight * gaussianPDFraw(x, m.mean, m.std);
      });
    } else if (distParams.type === 'skewed') {
      total += skewNormalPDFraw(x, distParams.mean, distParams.std, distParams.alpha);
    } else if (distParams.type === 'peaked') {
      total += distParams.peakWeight * gaussianPDFraw(x, distParams.peakLocation, distParams.peakStd);
      total += (1 - distParams.peakWeight) * uniformPDFraw(x, distParams.low, distParams.high);
    }
  }
  return total;
}

function getDistPeaks(distParams) {
  if (!distParams) return [];
  switch (distParams.type) {
    case 'gaussian':
      return [distParams.mean];
    case 'uniform':
      return [wrapAngle((distParams.low + distParams.high) / 2)];
    case 'bimodal':
    case 'multimodal':
      return distParams.modes.map((m) => m.mean);
    case 'peaked':
      return [distParams.peakLocation];
    case 'skewed': {
      let bestX = distParams.mean;
      let bestD = -Infinity;
      for (let x = 0; x < 360; x += 0.5) {
        const d = marginalPDF(distParams, x);
        if (d > bestD) {
          bestD = d;
          bestX = x;
        }
      }
      return [bestX];
    }
    default:
      return [];
  }
}

function distanceToNearestPeak(angle, peaks) {
  if (peaks.length === 0) return null;
  return Math.min(...peaks.map((p) => circularDist(angle, p)));
}

function buildDistributionChart(distParams, angles, barColor, chartWidth = 720, chartHeight = 160) {
  const nBins = 24;
  const binWidth = 360 / nBins;
  const counts = new Array(nBins).fill(0);
  angles.forEach((a) => {
    let idx = Math.floor(a / binWidth);
    if (idx >= nBins) idx = nBins - 1;
    counts[idx]++;
  });
  const n = angles.length;
  const density = counts.map((c) => c / (n * binWidth));

  const curvePts = [];
  for (let x = 0; x < 360; x += 2) {
    curvePts.push({ x, d: marginalPDF(distParams, x) });
  }

  const maxScale = Math.max(...density, ...curvePts.map((p) => p.d), 1e-6) * 1.15;
  const CH_W = chartWidth, CH_H = chartHeight;
  const barW = CH_W / nBins;

  const bars = density
    .map((d, i) => {
      const h = (d / maxScale) * CH_H;
      const x = i * barW;
      return `<rect x="${x}" y="${CH_H - h}" width="${barW - 1}" height="${h}" fill="${barColor}" opacity="0.6" />`;
    })
    .join('');

  const linePts = curvePts
    .map((p) => {
      const x = (p.x / 360) * CH_W;
      const y = CH_H - (p.d / maxScale) * CH_H;
      return `${x},${y}`;
    })
    .join(' ');

  return `
    <svg width="${CH_W}" height="${CH_H}" style="background:#1a1200; border:3px solid #000;">
      ${bars}
      <polyline points="${linePts}" fill="none" stroke="#5a3e1b" stroke-width="2" />
    </svg>
    <div style="display:flex; justify-content:space-between; width:${CH_W}px; margin:2px auto 0 auto; font-size:9px; color:#ffe9b3;">
      <span>0&deg;</span><span>90&deg;</span><span>180&deg;</span><span>270&deg;</span><span>360&deg;</span>
    </div>
  `;
}

function movingAverage(arr, windowSize) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = arr.slice(start, i + 1);
    return slice.reduce((a, b) => a + b, 0) / slice.length;
  });
}

function buildTrendChart(valuesArr, dotColor) {
  const n = valuesArr.length;
  const CH_W = 720, CH_H = 200;
  const padL = 34, padB = 22, padT = 10, padR = 10;
  const plotW = CH_W - padL - padR;
  const plotH = CH_H - padT - padB;
  const maxY = Math.max(...valuesArr, 1) * 1.15;
  const windowSize = Math.min(5, n);

  const xFor = (i) => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yFor = (v) => padT + plotH - (v / maxY) * plotH;

  const rawPts = valuesArr.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' ');
  const ma = movingAverage(valuesArr, windowSize);
  const maPts = ma.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' ');
  const dots = valuesArr
    .map((v, i) => `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${dotColor}" opacity="0.7" />`)
    .join('');

  const yTicks = [0, maxY / 2, maxY];
  const yAxis = yTicks
    .map(
      (v) => `
      <text x="${padL - 6}" y="${yFor(v) + 4}" font-size="10" fill="#5a3e1b" text-anchor="end">${Math.round(v)}</text>
      <line x1="${padL}" y1="${yFor(v)}" x2="${CH_W - padR}" y2="${yFor(v)}" stroke="#ccc" stroke-width="0.5" />
    `
    )
    .join('');

  const xTickEvery = Math.max(1, Math.ceil(n / 10));
  const xAxis = valuesArr
    .map((_, i) =>
      i % xTickEvery === 0
        ? `<text x="${xFor(i)}" y="${CH_H - padB + 14}" font-size="10" fill="#5a3e1b" text-anchor="middle">${i + 1}</text>`
        : ''
    )
    .join('');

  return {
    windowSize,
    svg: `
    <svg width="${CH_W}" height="${CH_H}" style="background:#1a1200; border:3px solid #000;">
      ${yAxis}
      <polyline points="${rawPts}" fill="none" stroke="${dotColor}" stroke-width="1.5" opacity="0.5" />
      ${dots}
      <polyline points="${maPts}" fill="none" stroke="#5a3e1b" stroke-width="2.5" />
      ${xAxis}
    </svg>`,
  };
}

function buildLearningCurveChart(caughtArr) {
  const { svg, windowSize } = buildTrendChart(caughtArr, '#d97a5f');
  return `
    ${svg}
    <div style="font-size:11px; color:#5a3e1b; margin-top:2px;">
      round number (x-axis) &nbsp;|&nbsp; orange dots = rabbits caught that round &nbsp;|&nbsp;
      dark line = moving average (window ${windowSize})
    </div>
  `;
}

function buildTrapAccuracyChart(errorsArr) {
  const { svg, windowSize } = buildTrendChart(errorsArr, '#8b5a2b');
  return `
    ${svg}
    <div style="font-size:11px; color:#5a3e1b; margin-top:2px;">
      round number (x-axis) &nbsp;|&nbsp; brown dots = mean trap distance to nearest true hotspot (&deg;) &nbsp;|&nbsp;
      dark line = moving average (window ${windowSize})
    </div>
  `;
}

// ---------- meadow field background art ----------
function buildFieldSVG() {
  let deco = '';
  const nDeco = 90;
  const petals = ['🌾', '🥕', '🍂'];
  for (let i = 0; i < nDeco; i++) {
    const r = PATH_RADIUS + (Math.random() - 0.5) * (PATH_WIDTH + 30);
    const theta = Math.random() * Math.PI * 2;
    const x = CENTER + r * Math.cos(theta);
    const y = CENTER + r * Math.sin(theta);
    const size = 10 + Math.random() * 6;
    const emoji = petals[Math.floor(Math.random() * petals.length)];
    deco += `<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle" opacity="0.8">${emoji}</text>`;
  }

  return `
    <svg width="520" height="520" style="position:absolute; top:0; left:0;">
      <defs>
        <radialGradient id="fieldGrad" cx="50%" cy="45%" r="65%">
          <stop offset="0%" stop-color="#fff3d6" />
          <stop offset="100%" stop-color="#f0d090" />
        </radialGradient>
      </defs>
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="url(#fieldGrad)" stroke="#a0522d" stroke-width="4" />
      ${deco}
      <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none"
              stroke="#c2955a" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.9" />
      <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="none" stroke="#a0522d" stroke-width="4" />
    </svg>
  `;
}

// ---------- CSV data export ----------
function csvEscape(val) {
  const s = String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCSV() {
  const distType = lastSessionDist ? lastSessionDist.type : '';
  const distSummary = lastSessionDist ? JSON.stringify(lastSessionDist) : '';
  const distPeaks = lastSessionDist ? getDistPeaks(lastSessionDist) : [];

  const header = [
    'round', 'rabbit_index', 'rabbit_angle_deg', 'caught',
    'round_num_traps', 'round_trap_angles_deg', 'round_caught_count', 'round_num_rabbits',
    'round_mean_trap_to_peak_deg', 'round_rt_ms',
    'session_distribution_type', 'session_distribution_params',
  ];
  const rows = [header.join(',')];

  completedRounds.forEach((r) => {
    const meanTrapErr = distPeaks.length > 0
      ? (r.trapAngles.reduce((a, ang) => a + distanceToNearestPeak(ang, distPeaks), 0) / r.trapAngles.length).toFixed(2)
      : '';
    r.rabbitAngles.forEach((rabbitAngle, i) => {
      const caught = r.trapAngles.some((trap) => circularDist(trap, rabbitAngle) <= CATCH_TOLERANCE_DEG);
      const row = [
        r.round,
        i + 1,
        rabbitAngle.toFixed(2),
        caught,
        r.trapAngles.length,
        csvEscape(r.trapAngles.map((a) => a.toFixed(2)).join(';')),
        r.caughtCount,
        r.rabbitAngles.length,
        meanTrapErr,
        r.rt.toFixed(1),
        distType,
        csvEscape(distSummary),
      ];
      rows.push(row.join(','));
    });
  });
  return rows.join('\n');
}

function downloadCSV() {
  if (completedRounds.length === 0) return;
  const csv = buildCSV();
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const a = document.createElement('a');
  a.href = url;
  a.download = `trap_setting_task_data_${ts}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- responsive field scaling ----------
function fitFieldToScreen(boxSize) {
  const wrap = document.getElementById('field-wrap');
  const box = document.getElementById('field-box');
  if (!wrap || !box) return;
  const available = Math.min(wrap.clientWidth, boxSize);
  const scale = available / boxSize;
  box.style.transform = `scale(${scale})`;
  wrap.style.height = `${boxSize * scale}px`;
}
window.addEventListener('resize', () => fitFieldToScreen(520));

// ---------- global state ----------
let jsPsychInstance;
let lastSessionDist = null;
// { round, trapAngles, rabbitAngles, caughtCount, rt }
const completedRounds = [];

function startTask() {
  const display = jsPsychInstance.getDisplayElement();
  document.body.classList.remove('twilight');

  display.innerHTML = `
    <h1 class="title">🪤 Bard's Twilight Hunt 🐇</h1>
    <div id="scoreboard"></div>
    <div id="trap-tray"></div>
    <div id="field-wrap">
      <div id="field-box">
        ${buildFieldSVG()}
        <div id="phase-banner">☀️ Daytime: set your traps</div>
        <div id="result-banner"></div>
      </div>
    </div>
    <button id="end-game-btn">🏁 End Game &amp; See Results</button>
  `;
  fitFieldToScreen(520);

  const fieldBox = display.querySelector('#field-box');
  const scoreboard = display.querySelector('#scoreboard');
  const trapTray = display.querySelector('#trap-tray');
  const phaseBanner = display.querySelector('#phase-banner');
  const resultBanner = display.querySelector('#result-banner');
  const endGameBtn = display.querySelector('#end-game-btn');

  const sessionDist = makeSessionDist();
  lastSessionDist = sessionDist;

  let phase = 'day'; // 'day' | 'twilight'
  let trialStartTime = performance.now();
  let placedTraps = []; // { angle, el }
  let totalCaught = 0;
  let totalRabbits = 0;

  function totalStats() {
    const roundsDone = completedRounds.length;
    return { roundsDone, totalCaught, totalRabbits };
  }

  function updateScoreboard() {
    const { roundsDone, totalCaught: tc, totalRabbits: tr } = totalStats();
    const rate = tr > 0 ? Math.round((tc / tr) * 100) : 0;
    scoreboard.textContent =
      `Round ${roundsDone + 1} | Traps placed: ${placedTraps.length}/${N_TRAPS} | ` +
      `Total caught: ${tc}/${tr} (${rate}%)`;
  }

  function renderTrapTray() {
    let html = '';
    for (let i = 0; i < N_TRAPS; i++) {
      const placed = i < placedTraps.length;
      html += `<span class="trap-slot${placed ? ' placed' : ''}">🪤</span>`;
    }
    trapTray.innerHTML = html;
  }

  function showCallout(p, text, color) {
    const el = document.createElement('div');
    el.className = 'callout-text';
    el.textContent = text;
    el.style.color = color;
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y - 30}px`;
    fieldBox.appendChild(el);
    requestAnimationFrame(() => {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%, -60%)';
    });
    setTimeout(() => el.remove(), 750);
  }

  function showResultBanner(text, good) {
    resultBanner.textContent = text;
    resultBanner.style.background = good ? 'rgba(255,255,255,0.92)' : 'rgba(75,59,107,0.9)';
    resultBanner.style.color = good ? '#a0522d' : '#f4c76b';
    resultBanner.classList.add('show');
    setTimeout(() => resultBanner.classList.remove('show'), 1500);
  }

  function onFieldClick(evt) {
    if (phase !== 'day') return;
    const rect = fieldBox.getBoundingClientRect();
    const scaleFactor = rect.width / 520;
    const x = (evt.clientX - rect.left) / scaleFactor;
    const y = (evt.clientY - rect.top) / scaleFactor;
    const dx = x - CENTER, dy = y - CENTER;
    if (Math.sqrt(dx * dx + dy * dy) > FIELD_RADIUS) return; // must click inside the meadow

    // the trap space is 1D: only the click's angle matters, so the trap
    // always sits on the path ring at that angle.
    const angle = xyToAngle(x, y);
    const p = angleToXY(angle, PATH_RADIUS);

    const el = document.createElement('div');
    el.className = 'trap-icon';
    el.textContent = '🪤';
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y}px`;
    fieldBox.appendChild(el);

    placedTraps.push({ angle, el, point: p, active: true });
    renderTrapTray();
    updateScoreboard();

    if (placedTraps.length === N_TRAPS) {
      startTwilight();
    }
  }

  function startTwilight() {
    phase = 'twilight';
    document.body.classList.add('twilight');
    phaseBanner.textContent = '🌙 Twilight: the rabbits come out...';

    const rabbitAngles = [];
    for (let i = 0; i < N_RABBITS_PER_ROUND; i++) {
      rabbitAngles.push(drawFromDist(sessionDist));
    }
    popRabbit(0, rabbitAngles, 0);
  }

  function popRabbit(index, rabbitAngles, caughtSoFar) {
    if (index >= rabbitAngles.length) {
      finishRound(rabbitAngles, caughtSoFar);
      return;
    }
    const angle = rabbitAngles[index];
    const p = angleToXY(angle, PATH_RADIUS);
    // only still-active (un-sprung) traps can catch a rabbit
    const gotCaught = placedTraps.some((t) => t.active && circularDist(t.angle, angle) <= CATCH_TOLERANCE_DEG);

    const rabbitEl = document.createElement('div');
    rabbitEl.className = 'rabbit-icon';
    rabbitEl.textContent = '🐇';
    rabbitEl.style.left = `${p.x}px`;
    rabbitEl.style.top = `${p.y}px`;
    fieldBox.appendChild(rabbitEl);

    setTimeout(() => {
      if (gotCaught) {
        rabbitEl.classList.add('caught');
        // spring the nearest active trap, then inactivate it -- a trap
        // can only catch one rabbit per round
        const nearestTrap = placedTraps.reduce((best, t) => {
          if (!t.active || circularDist(t.angle, angle) > CATCH_TOLERANCE_DEG) return best;
          const d = circularDist(t.angle, angle);
          return !best || d < best.d ? { t, d } : best;
        }, null);
        if (nearestTrap) {
          nearestTrap.t.active = false;
          nearestTrap.t.el.classList.add('sprung');
          setTimeout(() => {
            nearestTrap.t.el.remove();
          }, 350);
        }
        showCallout(p, 'Caught!', '#f4c76b');
        setTimeout(() => { rabbitEl.textContent = '💫'; }, 350);
      } else {
        const poof = document.createElement('div');
        poof.className = 'poof-icon';
        poof.textContent = '💨';
        poof.style.left = `${p.x}px`;
        poof.style.top = `${p.y}px`;
        fieldBox.appendChild(poof);
        setTimeout(() => poof.remove(), 500);
      }

      setTimeout(() => {
        rabbitEl.remove();
        popRabbit(index + 1, rabbitAngles, caughtSoFar + (gotCaught ? 1 : 0));
      }, 450);
    }, 300);
  }

  function finishRound(rabbitAngles, caughtCount) {
    showResultBanner(`Caught ${caughtCount} / ${rabbitAngles.length} 🐇`, caughtCount > rabbitAngles.length / 2);

    const rt = performance.now() - trialStartTime;
    completedRounds.push({
      round: completedRounds.length + 1,
      trapAngles: placedTraps.map((t) => t.angle),
      rabbitAngles: rabbitAngles,
      caughtCount: caughtCount,
      rt: rt,
    });
    totalCaught += caughtCount;
    totalRabbits += rabbitAngles.length;

    setTimeout(() => {
      placedTraps.forEach((t) => t.el.remove());
      placedTraps = [];
      phase = 'day';
      document.body.classList.remove('twilight');
      phaseBanner.textContent = '☀️ Daytime: set your traps';
      trialStartTime = performance.now();
      renderTrapTray();
      updateScoreboard();
    }, 1200);
  }

  function cleanupListeners() {
    fieldBox.removeEventListener('click', onFieldClick);
    document.removeEventListener('keydown', onKeydown);
    endGameBtn.removeEventListener('click', onEndGameClick);
  }

  const onKeydown = (evt) => {
    if (evt.key === 'Escape') {
      cleanupListeners();
      showAnalysisScreen();
    }
  };

  const onEndGameClick = () => {
    cleanupListeners();
    showAnalysisScreen();
  };

  fieldBox.addEventListener('click', onFieldClick);
  document.addEventListener('keydown', onKeydown);
  endGameBtn.addEventListener('click', onEndGameClick);

  renderTrapTray();
  updateScoreboard();
}

// ---------- analysis screen (ESC ends the task) ----------
function showAnalysisScreen() {
  const display = jsPsychInstance.getDisplayElement();
  document.body.classList.remove('twilight');

  if (completedRounds.length === 0) {
    display.innerHTML = `
      <div class="story-box" style="margin-top:60px;">
        <p style="font-size:22px;">🪤 Task ended.</p>
        <p>No rounds were completed before ending.</p>
      </div>
    `;
    return;
  }

  const n = completedRounds.length;
  const caughtArr = completedRounds.map((r) => r.caughtCount);
  const meanCaught = caughtArr.reduce((a, b) => a + b, 0) / n;
  const totalCaught = caughtArr.reduce((a, b) => a + b, 0);
  const totalRabbits = n * N_RABBITS_PER_ROUND;
  const catchRate = Math.round((totalCaught / totalRabbits) * 100);

  const bins = Array.from({ length: N_RABBITS_PER_ROUND + 1 }, (_, i) => i);
  const counts = bins.map((b) => caughtArr.filter((c) => c === b).length);
  const maxCount = Math.max(...counts, 1);
  let bars_html = '';
  let labels_html = '';
  counts.forEach((c, i) => {
    const height = Math.round((c / maxCount) * 140);
    bars_html += `<div style="display:flex; flex-direction:column; align-items:center;">
        <div style="font-size:11px; color:#5a3e1b; margin-bottom:2px;">${c}</div>
        <div class="hist-bar" style="height:${height}px;"></div>
      </div>`;
    labels_html += `<div class="hist-label">${bins[i]}</div>`;
  });

  const learningCurveChart = buildLearningCurveChart(caughtArr);

  const distPeaks = lastSessionDist ? getDistPeaks(lastSessionDist) : [];
  const trapAccuracyErrors = distPeaks.length > 0
    ? completedRounds.map(
        (r) => r.trapAngles.reduce((a, ang) => a + distanceToNearestPeak(ang, distPeaks), 0) / r.trapAngles.length
      )
    : [];
  const trapAccuracyChart = trapAccuracyErrors.length > 0 ? buildTrapAccuracyChart(trapAccuracyErrors) : '';

  const thirdSize = Math.max(1, Math.ceil(n / 3));
  const earlyRounds = completedRounds.slice(0, thirdSize);
  const middleRounds = completedRounds.slice(thirdSize, thirdSize * 2);
  const lateRounds = completedRounds.slice(thirdSize * 2);
  const earlyTraps = earlyRounds.flatMap((r) => r.trapAngles);
  const middleTraps = middleRounds.flatMap((r) => r.trapAngles);
  const lateTraps = lateRounds.flatMap((r) => r.trapAngles);
  const MINI_W = 330, MINI_H = 130;
  const earlyChart = lastSessionDist && earlyTraps.length > 0
    ? buildDistributionChart(lastSessionDist, earlyTraps, '#f4a261', MINI_W, MINI_H)
    : '';
  const middleChart = lastSessionDist && middleTraps.length > 0
    ? buildDistributionChart(lastSessionDist, middleTraps, '#d97a5f', MINI_W, MINI_H)
    : '';
  const lateChart = lastSessionDist && lateTraps.length > 0
    ? buildDistributionChart(lastSessionDist, lateTraps, '#8b5a2b', MINI_W, MINI_H)
    : '';

  const ringOutline = `
    <circle cx="${CENTER}" cy="${CENTER}" r="${FIELD_RADIUS}" fill="#fff6e6" stroke="#a0522d" stroke-width="3" />
    <circle cx="${CENTER}" cy="${CENTER}" r="${PATH_RADIUS}" fill="none" stroke="#c2955a" stroke-width="${PATH_WIDTH}" stroke-dasharray="10 8" opacity="0.6" />
  `;

  const trap_dots = completedRounds
    .flatMap((r) => r.trapAngles)
    .map((a) => {
      const p = angleToXY(a, PATH_RADIUS);
      return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#8b5a2b" opacity="0.75" />`;
    })
    .join('');

  const rabbit_dots = completedRounds
    .flatMap((r) =>
      r.rabbitAngles.map((a) => {
        const caught = r.trapAngles.some((trap) => circularDist(trap, a) <= CATCH_TOLERANCE_DEG);
        const p = angleToXY(a, PATH_RADIUS);
        return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${caught ? '#2ecc40' : '#e74c3c'}" opacity="0.7" />`;
      })
    )
    .join('');

  const distLabel = lastSessionDist ? DIST_LABELS[lastSessionDist.type] : 'Unknown';
  const trapChart = lastSessionDist
    ? buildDistributionChart(lastSessionDist, completedRounds.flatMap((r) => r.trapAngles), '#8b5a2b')
    : '';
  const rabbitChart = lastSessionDist
    ? buildDistributionChart(lastSessionDist, completedRounds.flatMap((r) => r.rabbitAngles), '#d97a5f')
    : '';

  display.innerHTML = `
    <div class="story-box" style="max-width:1100px; text-align:center;">
      <p style="font-size:24px;">🪤 Bard's Trap-Setting Report</p>
      <p style="font-size:16px;">
        Rounds played: <b>${n}</b> &nbsp;|&nbsp;
        Mean caught per round: <b>${meanCaught.toFixed(1)} / ${N_RABBITS_PER_ROUND}</b> &nbsp;|&nbsp;
        Overall catch rate: <b>${catchRate}%</b>
      </p>

      <p style="font-size:14px; margin-top:16px;">Rabbits caught per round (out of ${N_RABBITS_PER_ROUND})</p>
      <div class="hist-bar-wrap">${bars_html}</div>
      <div style="display:flex; justify-content:center; gap:4px;">${labels_html}</div>

      <p style="font-size:14px; margin-top:24px;">Learning curve: rabbits caught, round by round</p>
      <div style="margin-top:6px;">${learningCurveChart}</div>

      ${trapAccuracyChart ? `
        <p style="font-size:14px; margin-top:24px;">Trap accuracy: mean distance of your traps to the nearest true hotspot, round by round</p>
        <div style="margin-top:6px;">${trapAccuracyChart}</div>
      ` : ''}

      <p style="font-size:14px; margin-top:24px;">
        The rabbits' spawn locations followed a: <b>${distLabel}</b> distribution (hidden from you during play)
      </p>
      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:6px;">
        <div>
          <p style="font-size:13px;">Where you set your traps</p>
          ${trapChart}
        </div>
        <div>
          <p style="font-size:13px;">Where rabbits actually popped up</p>
          ${rabbitChart}
        </div>
      </div>
      <p style="font-size:12px; margin-top:8px;">
        brown bars = trap density &nbsp;|&nbsp; orange bars = rabbit-spawn density &nbsp;|&nbsp;
        dark curve = theoretical generating distribution
      </p>

      ${(earlyChart || middleChart || lateChart) ? `
        <p style="font-size:14px; margin-top:24px;">Did your trap placement drift toward the true hotspots over time?</p>
        <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:6px;">
          <div>
            <p style="font-size:12px;">Early (rounds 1&ndash;${earlyRounds.length})</p>
            ${earlyChart}
          </div>
          <div>
            <p style="font-size:12px;">Middle (rounds ${earlyRounds.length + 1}&ndash;${earlyRounds.length + middleRounds.length})</p>
            ${middleChart}
          </div>
          <div>
            <p style="font-size:12px;">Late (rounds ${earlyRounds.length + middleRounds.length + 1}&ndash;${n})</p>
            ${lateChart}
          </div>
        </div>
        <p style="font-size:12px; margin-top:6px;">
          bars = empirical trap density for that third of the session &nbsp;|&nbsp; dark curve = theoretical generating distribution
        </p>
      ` : ''}

      <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:24px;">
        <div>
          <p style="font-size:14px;">Every trap you ever set</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${trap_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#8b5a2b;"></span>trap location</span>
          </div>
        </div>

        <div>
          <p style="font-size:14px;">Every rabbit that popped up</p>
          <div style="position:relative; width:520px; height:520px; margin:10px auto;">
            <svg width="520" height="520" style="position:absolute; top:0; left:0;">
              ${ringOutline}
              ${rabbit_dots}
            </svg>
          </div>
          <div class="recap-legend">
            <span><span class="legend-dot" style="background:#2ecc40;"></span>caught</span>
            <span><span class="legend-dot" style="background:#e74c3c;"></span>escaped</span>
          </div>
        </div>
      </div>

      <p style="font-size:12px; margin-top:20px; color:#5a3e1b;">
        Your data has been downloaded automatically as a CSV.
        <button id="redownload-btn" style="margin-left:8px; padding:6px 10px; font-family:'Press Start 2P', monospace; font-size:9px; border-radius:0; border:3px solid #000; box-shadow:3px 3px 0 0 #000; background:#ffd700; color:#000; cursor:pointer;">
          Download again
        </button>
      </p>
    </div>
  `;

  display.querySelector('#redownload-btn').addEventListener('click', downloadCSV);
  downloadCSV();
}

// ---------- experiment setup ----------
const jsPsych = initJsPsych({
  on_finish: function() {
    const last = jsPsych.data.get().last(1).values()[0];
    if (last && last.selected_distributions) {
      allowedDistTypes = last.selected_distributions;
    }
    startTask();
  }
});
jsPsychInstance = jsPsych;

const instructions = {
  type: jsPsychHtmlKeyboardResponse,

  stimulus: `
